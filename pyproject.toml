[project]
name = "jcvd-bot"
version = "0.1.0"
description = "Bot RAG pédagogique qui parle comme Jean-Claude Van Damme (Chroma + Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "chromadb>=1.0",
    "python-telegram-bot>=22.8",
    "sentence-transformers>=3.0",
]

[project.scripts]
jcvd = "jcvd_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
